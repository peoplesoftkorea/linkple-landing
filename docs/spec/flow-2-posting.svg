<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" font-family="Apple SD Gothic Neo, AppleGothic, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#45566b"/>
    </marker>
    <marker id="arrowBrand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#12b886"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e03131"/>
    </marker>
  </defs>

  <rect width="1400" height="520" fill="#ffffff"/>
  <text x="30" y="42" font-size="26" font-weight="700" fill="#0f1b2d">유저 플로우 B — 공고를 등록하고 관리한다</text>
  <text x="30" y="70" font-size="15" fill="#7b8a9c">구인기업 담당자 관점 · 점선 노드 = 조건부로만 거치는 화면</text>

  <g>
    <rect x="30" y="230" width="170" height="80" rx="12" fill="#ffffff" stroke="#12b886" stroke-width="2.5"/>
    <text x="115" y="265" font-size="18" font-weight="700" fill="#0f1b2d" text-anchor="middle">헤더 · 홈</text>
    <text x="115" y="288" font-size="13" fill="#7b8a9c" text-anchor="middle">공고 등록 클릭</text>
  </g>
  <g>
    <rect x="260" y="230" width="170" height="80" rx="12" fill="#f3f8f6" stroke="#cfe0d8" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="345" y="265" font-size="18" font-weight="700" fill="#45566b" text-anchor="middle">로그인</text>
    <text x="345" y="288" font-size="13" fill="#7b8a9c" text-anchor="middle">/login</text>
  </g>
  <g>
    <rect x="490" y="230" width="190" height="80" rx="12" fill="#e7f7f1" stroke="#12b886" stroke-width="2.5"/>
    <text x="585" y="265" font-size="18" font-weight="700" fill="#0b7a5c" text-anchor="middle">공고 등록</text>
    <text x="585" y="288" font-size="13" fill="#0b7a5c" text-anchor="middle">/jobs/new · 9개 필드</text>
  </g>
  <g>
    <rect x="740" y="230" width="190" height="80" rx="12" fill="#ffffff" stroke="#12b886" stroke-width="2.5"/>
    <text x="835" y="265" font-size="18" font-weight="700" fill="#0f1b2d" text-anchor="middle">공고 상세</text>
    <text x="835" y="288" font-size="13" fill="#7b8a9c" text-anchor="middle">내가 등록한 공고</text>
  </g>
  <g>
    <rect x="990" y="230" width="170" height="80" rx="12" fill="#fff0f0" stroke="#e03131" stroke-width="2.5"/>
    <text x="1075" y="265" font-size="18" font-weight="700" fill="#e03131" text-anchor="middle">삭제 확인</text>
    <text x="1075" y="288" font-size="13" fill="#e03131" text-anchor="middle">되돌릴 수 없음</text>
  </g>
  <g>
    <rect x="1220" y="230" width="150" height="80" rx="12" fill="#ffffff" stroke="#12b886" stroke-width="2.5"/>
    <text x="1295" y="265" font-size="18" font-weight="700" fill="#0f1b2d" text-anchor="middle">공고 목록</text>
    <text x="1295" y="288" font-size="13" fill="#7b8a9c" text-anchor="middle">/jobs</text>
  </g>

  <line x1="200" y1="270" x2="254" y2="270" stroke="#12b886" stroke-width="2.5" marker-end="url(#arrowBrand)"/>
  <line x1="430" y1="270" x2="484" y2="270" stroke="#12b886" stroke-width="2.5" marker-end="url(#arrowBrand)"/>
  <line x1="680" y1="270" x2="734" y2="270" stroke="#12b886" stroke-width="2.5" marker-end="url(#arrowBrand)"/>
  <line x1="930" y1="270" x2="984" y2="270" stroke="#e03131" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <line x1="1160" y1="270" x2="1214" y2="270" stroke="#e03131" stroke-width="2.5" marker-end="url(#arrowRed)"/>

  <text x="227" y="258" font-size="13" fill="#45566b" text-anchor="middle">비로그인</text>
  <text x="457" y="258" font-size="13" fill="#45566b" text-anchor="middle">복귀</text>
  <text x="707" y="258" font-size="13" fill="#45566b" text-anchor="middle">저장</text>
  <text x="957" y="258" font-size="13" fill="#e03131" text-anchor="middle">삭제</text>
  <text x="1187" y="258" font-size="13" fill="#e03131" text-anchor="middle">확인</text>

  <!-- 로그인 건너뜀 -->
  <path d="M 115 230 L 115 160 L 585 160 L 585 224" fill="none" stroke="#12b886" stroke-width="2.5" marker-end="url(#arrowBrand)"/>
  <text x="350" y="150" font-size="14" fill="#0b7a5c" text-anchor="middle">이미 로그인했다면 곧바로 등록 화면으로</text>

  <!-- 검증 실패 되돌림 -->
  <path d="M 530 310 L 530 380 L 640 380 L 640 310" fill="none" stroke="#e03131" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowRed)"/>
  <text x="585" y="404" font-size="13" fill="#e03131" text-anchor="middle">검증 실패 — 저장하지 않고 오류 요약으로 포커스 이동</text>

  <!-- 삭제 연쇄 -->
  <text x="1075" y="344" font-size="13" fill="#e03131" text-anchor="middle">공고에 달린 지원 내역도 함께 정리</text>

  <rect x="30" y="430" width="1340" height="60" rx="10" fill="#f3f8f6"/>
  <text x="52" y="457" font-size="14" fill="#45566b">저장 성공 시 등록한 공고 상세로 이동한다. 뒤로 가기로 작성 폼에 되돌아오지 않도록 히스토리를 교체한다.</text>
  <text x="52" y="479" font-size="14" fill="#45566b">삭제 버튼은 본인이 등록한 공고에만 나타난다. 시드로 제공된 공고에는 노출되지 않는다.</text>
</svg>
